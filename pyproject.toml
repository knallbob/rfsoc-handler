[project]
name = "rpc_rfsoc_handler"
version = "1.1.8"
description = "A pip-installable handler for the RfSoC"
readme = "README.md"
license='MIT'
authors = [
    { name = "knallbob", email = "pascal.stoever@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grpcio-tools>=1.78.0",
    "pyserial>=3.5",
]


[project.urls]
Repository = "https://github.com/knallbob/rfsoc-handler"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
